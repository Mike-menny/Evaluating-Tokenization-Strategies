<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MIDI Tokenization</title>
  <script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.77,npm/@magenta/music@1.23.1/es6/core.js,npm/html-midi-player@1.5.0"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #1a1714;
      --ink: #f2ebe0;
      --muted: #b5a898;
      --line: #3d362e;
      --accent: #c4a35a;
      --accent-2: #7d9b76;
      --danger: #c47a6a;
      --panel: rgba(36, 32, 27, 0.92);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "IBM Plex Sans", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #3a3228 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #2a3328 0%, transparent 50%),
        linear-gradient(180deg, #15130f 0%, var(--bg0) 40%, #12100e 100%);
    }
    .wrap {
      width: min(1100px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.25rem 0 3rem;
    }
    header {
      display: grid;
      gap: 0.55rem;
      margin-bottom: 1.75rem;
    }
    .brand {
      font-family: Fraunces, serif;
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .lede {
      max-width: 40rem;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }
    .status {
      font-size: 0.9rem;
      color: var(--muted);
    }
    .status.ok { color: var(--accent-2); }
    .status.err { color: var(--danger); }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.2rem 1.25rem 1.3rem;
      backdrop-filter: blur(8px);
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.95rem 1rem;
    }
    label {
      display: grid;
      gap: 0.35rem;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    select, input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      background: #18150f;
      color: var(--ink);
      border-radius: 8px;
      padding: 0.58rem 0.7rem;
      font: inherit;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-top: 1.1rem;
    }
    button#generate {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 0.75rem 1.35rem;
      font: 600 0.95rem/1 "IBM Plex Sans", sans-serif;
      cursor: pointer;
      background: var(--accent);
      color: #1a1408;
    }
    button#generate:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    a.dl {
      display: none;
      text-decoration: none;
      padding: 0.72rem 1.2rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      font: 600 0.9rem/1 "IBM Plex Sans", sans-serif;
    }
    .meta-line {
      color: var(--muted);
      font-size: 0.92rem;
    }
    .stage {
      margin-top: 1.25rem;
    }
    .hint {
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 0.85rem;
    }
    midi-player {
      display: block;
      width: 100%;
      margin-bottom: 0.9rem;
    }
    midi-visualizer {
      display: block;
      width: 100%;
      overflow-x: auto;
      background: #100e0c;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 4px;
    }
    midi-visualizer .piano-roll-visualizer {
      background: transparent;
    }
    @media (max-width: 820px) {
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">MIDI Tokenization</div>
      <p class="lede">
        Choose a composer and genre, then generate a piano performance.
        Play it below — notes light up on the piano roll as it plays.
      </p>
      <div id="boot-status" class="status">Preparing…</div>
    </header>

    <section class="panel">
      <div class="controls">
        <label>Tokenization
          <select id="mode"></select>
        </label>
        <label>Composer
          <select id="composer"></select>
        </label>
        <label>Genre
          <select id="genre"></select>
        </label>
        <label>Length
          <input id="max_tokens" type="number" min="128" max="8192" step="128" value="2048" />
        </label>
        <label>Temperature
          <input id="temperature" type="number" min="0.1" max="2" step="0.05" value="0.95" />
        </label>
        <label>Top-p
          <input id="top_p" type="number" min="0.1" max="1" step="0.01" value="0.98" />
        </label>
      </div>
      <div class="actions">
        <button id="generate" type="button">Generate</button>
        <a id="download-midi" class="dl" href="#">Download MIDI</a>
        <span id="gen-meta" class="meta-line"></span>
      </div>
    </section>

    <section class="stage panel">
      <div class="hint">Press play to hear the piano and follow along on the roll</div>
      <midi-player
        id="player"
        sound-font="https://storage.googleapis.com/magentadata/js/soundfonts/sgm_plus"
        visualizer="#visualizer"
      ></midi-player>
      <midi-visualizer type="piano-roll" id="visualizer"></midi-visualizer>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function fillSelect(el, values, selected) {
      el.innerHTML = "";
      for (const v of values) {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        if (v === selected) opt.selected = true;
        el.appendChild(opt);
      }
    }

    async function boot() {
      try {
        const data = await (await fetch("/api/meta")).json();
        fillSelect($("mode"), data.modes, data.defaults.mode);
        fillSelect($("composer"), data.composers, data.defaults.composer);
        fillSelect($("genre"), data.genres, data.defaults.genre);
        $("max_tokens").value = data.defaults.max_tokens;
        $("temperature").value = data.defaults.temperature;
        $("top_p").value = data.defaults.top_p;
        $("boot-status").className = "status ok";
        $("boot-status").textContent = "Ready — pick a style and press Generate";
      } catch (e) {
        $("boot-status").className = "status err";
        $("boot-status").textContent = "Could not reach the demo server";
      }
    }

    $("generate").onclick = async () => {
      $("generate").disabled = true;
      $("gen-meta").textContent = "";
      $("boot-status").className = "status";
      $("boot-status").textContent = "Composing… this may take a moment";
      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            mode: $("mode").value,
            composer: $("composer").value,
            genre: $("genre").value,
            max_tokens: Number($("max_tokens").value),
            temperature: Number($("temperature").value),
            top_p: Number($("top_p").value),
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);

        $("player").src = data.midi_url + "?t=" + Date.now();
        $("download-midi").href = data.midi_url;
        $("download-midi").style.display = "inline-block";
        $("gen-meta").textContent = `${data.composer} · ${data.genre} · ${data.elapsed_sec}s`;
        $("boot-status").className = "status ok";
        $("boot-status").textContent = "Done — press play below";
      } catch (e) {
        $("boot-status").className = "status err";
        $("boot-status").textContent = String(e.message || e);
      } finally {
        $("generate").disabled = false;
      }
    };

    boot();
  </script>
</body>
</html>
